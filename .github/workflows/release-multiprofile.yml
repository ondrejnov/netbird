name: Release multiprofile

# A tag vX.Y.Z-multiprofile (or vX.Y.Z-multiprofile.N) publishes the fork's
# Linux packages and Windows installers, daemon and UI, to the GitHub releases
# of this repository once the installer test has passed. Pull requests that
# touch the release files and manual runs stop before publishing.
on:
  push:
    tags:
      - "v*-multiprofile"
      - "v*-multiprofile.*"
  pull_request:
    paths:
      - .github/workflows/release-multiprofile.yml
      - .goreleaser_multiprofile.yaml
      - client/installer_multiprofile.nsis
      - release_files/multiprofile/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GORELEASER_VER: "v2.16.0"
  IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the tag
        if: env.IS_TAG == 'true'
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-multiprofile(\.[0-9]+)?$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z-multiprofile or vX.Y.Z-multiprofile.N"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis jq libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev gcc-mingw-w64-x86-64

      - name: Install LLVM-MinGW for the Windows ARM64 UI
        run: |
          cd /tmp
          archive=llvm-mingw-20250709-ucrt-ubuntu-22.04-x86_64.tar.xz
          curl --fail --silent --show-error --location --proto '=https' --output "$archive" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20250709/$archive"
          echo "60cafae6474c7411174cff1d4ba21a8e46cadbaeb05a1bace306add301628337  $archive" | sha256sum -c
          tar -xf "$archive"
          echo "/tmp/${archive%.tar.xz}/bin" >> "$GITHUB_PATH"

      - name: Install wails3 CLI
        # The version from go.mod keeps the generated bindings and the
        # WebView2 bootstrapper in step with the runtime the UI links.
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION

      - name: Set snapshot flag
        if: env.IS_TAG != 'true'
        run: echo "flags=--snapshot" >> "$GITHUB_ENV"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: ${{ env.GORELEASER_VER }}
          args: release --config .goreleaser_multiprofile.yaml --clean ${{ env.flags }}
        env:
          # Another tag on the same commit, such as the upstream one the fork
          # release is based on, must not be picked instead.
          GORELEASER_CURRENT_TAG: ${{ env.IS_TAG == 'true' && github.ref_name || '' }}

      - name: Build Windows installers
        run: release_files/multiprofile/windows-installers.sh

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: release-multiprofile
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.zip
            dist/*_installer.exe
            dist/*_checksums.txt
          retention-days: 7

  test_windows_installer:
    runs-on: windows-2022
    needs: [build]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-multiprofile
          path: release

      - name: Install
        run: |
          $exe = Get-ChildItem release -Filter '*_windows_amd64_installer.exe' | Select-Object -First 1
          if (-not $exe) { throw 'amd64 installer not found' }
          $p = Start-Process $exe.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }

      - name: Check the installation
        run: |
          $dir = Join-Path $env:ProgramFiles 'Netbird'
          foreach ($file in 'netbird.exe', 'netbird-ui.exe', 'wintun.dll') {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "$file is missing" }
          }
          $shortcut = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\NetBird.lnk'
          if (-not (Test-Path $shortcut)) { throw 'the Start menu shortcut is missing' }
          $version = & (Join-Path $dir 'netbird.exe') version
          if ($version -notmatch '\+multiprofile$') { throw "unexpected version '$version'" }
          $svc = Get-Service -Name Netbird
          $svc.WaitForStatus('Running', [TimeSpan]::FromSeconds(30))
          $path = [Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';'
          if ($path -notcontains $dir) { throw "$dir is not on the machine PATH" }

      - name: Uninstall
        run: |
          $dir = Join-Path $env:ProgramFiles 'Netbird'
          $p = Start-Process (Join-Path $dir 'netbird_uninstall.exe') -ArgumentList "/S _?=$dir" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstaller exited with $($p.ExitCode)" }
          if (Get-Service -Name Netbird -ErrorAction SilentlyContinue) { throw 'the service is still registered' }
          foreach ($file in 'netbird.exe', 'netbird-ui.exe') {
            if (Test-Path (Join-Path $dir $file)) { throw "$file is still installed" }
          }
          $path = [Environment]::GetEnvironmentVariable('Path', 'Machine') -split ';'
          if ($path -contains $dir) { throw "$dir is still on the machine PATH" }

  publish:
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'ondrejnov/netbird'
    runs-on: ubuntu-24.04
    needs: [build, test_windows_installer]
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-multiprofile
          path: release

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          NetBird client with concurrent profiles, built from the ondrejnov/netbird fork.

          - Linux: `netbird-multiprofile` (daemon, amd64 and arm64) and `netbird-ui-multiprofile` (UI, amd64,
            GTK4 and WebKitGTK 6.0) as deb and rpm. They replace the upstream `netbird` and `netbird-ui` packages.
          - Windows: the installer sets up the daemon, the UI and Wintun and replaces an upstream install. The zip
            holds the same files for a manual setup. Nothing is signed, so SmartScreen asks for confirmation.
          - macOS: build it locally, see docs/macos-install.md.
          EOF
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo ondrejnov/netbird \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --latest
